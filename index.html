
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2027 새학기 점심 신청</title>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 20px;
  background: #f0f5f2;
  font-family: "Malgun Gothic", sans-serif;
  color: #24352d;
}
.container {
  max-width: 600px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 20px;
  box-shadow: 0 4px 20px #0000000d;
}
header {
  background: #184b40;
  color: white;
  padding: 25px 10px;
  border-radius: 15px;
  text-align: center;
}
header h1 {
  font-size: 25px;
  margin: 12px 0;
}
header p {
  font-size: 14px;
  margin: 5px;
}
input[type="text"] {
  width: 100%;
  padding: 15px;
  border: 1px solid #ccd5cf;
  border-radius: 10px;
  font-size: 16px;
}
.day {
  margin: 25px 0;
  padding-top: 12px;
  border-top: 1px solid #e5e7eb;
}
.day h3 {
  font-size: 17px;
}
.menu-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.menu {
  position: relative;
  cursor: pointer;
}
.menu input {
  position: absolute;
  opacity: 0;
}
.menu span {
  display: block;
  padding: 16px 5px;
  border: 2px solid #e1e7e3;
  border-radius: 12px;
  text-align: center;
  font-size: 15px;
}
.menu input:checked + span {
  background: #e0f4e9;
  border-color: #21845c;
  color: #176744;
  font-weight: bold;
}
.menu input:focus-visible + span {
  outline: 3px solid #4285f4;
}
button {
  width: 100%;
  padding: 17px;
  background: #184b40;
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}
#result {
  display: none;
  margin-top: 20px;
  padding: 20px;
  background: #e0f4e9;
  border-radius: 12px;
  white-space: pre-line;
  line-height: 1.8;
}
footer {
  text-align: center;
  color: #777;
  font-size: 12px;
  margin-top: 25px;
}
</style>
</head>

<body>
<div class="container">

<header>
  <p>2027학년도 새학기 준비기간</p>
  <h1>🍱 오늘의 점심 선택</h1>
  <p>2027. 2. 22. ~ 2. 24.</p>
</header>

<form id="lunchForm">
  <h3><label for="name">👤 교직원 성명</label></h3>
  <input type="text" id="name"
    placeholder="성명을 입력하세요"
    maxlength="30" required>

  <div id="days"></div>

  <button type="submit">
    점심 메뉴 신청하기
  </button>
</form>

<div id="result" role="status"></div>

<footer>
  2027학년도 새학기 준비기간<br>
  교직원 점심 메뉴 신청 시스템
</footer>

</div>

<script>
const schedule = [
  {
    date: "2월 22일 월요일",
    menus: ["제육덮밥", "돈가스",
            "비빔밥", "식사 안 함"]
  },
  {
    date: "2월 23일 화요일",
    menus: ["짜장면", "짬뽕",
            "볶음밥", "식사 안 함"]
  },
  {
    date: "2월 24일 수요일",
    menus: ["김치찌개", "순두부찌개",
            "불고기덮밥", "식사 안 함"]
  }
];

const days = document.getElementById("days");

schedule.forEach((day, i) => {
  days.innerHTML += `
    <section class="day">
      <h3>📅 ${day.date}</h3>
      <div class="menu-grid">
        ${day.menus.map(menu => `
          <label class="menu">
            <input type="radio"
              name="day${i}"
              value="${menu}" required>
            <span>${menu}</span>
          </label>
        `).join("")}
      </div>
    </section>
  `;
});

document.getElementById("lunchForm")
  .addEventListener("submit", function(e) {
    e.preventDefault();

    const name = document
      .getElementById("name").value.trim();

    if (!name) {
      alert("성명을 입력해 주세요.");
      return;
    }

    const data = {
      name: name,
      day1: document.querySelector(
        'input[name="day0"]:checked').value,
      day2: document.querySelector(
        'input[name="day1"]:checked').value,
      day3: document.querySelector(
        'input[name="day2"]:checked').value
    };

    const result = document
      .getElementById("result");

    result.style.display = "block";

    result.textContent =
      "✅ " + data.name + "님, 선택 완료!\n\n" +
      "2월 22일 : " + data.day1 + "\n" +
      "2월 23일 : " + data.day2 + "\n" +
      "2월 24일 : " + data.day3 + "\n\n" +
      "테스트 단계입니다. 아직 저장되지 않습니다.";

    result.scrollIntoView({
      behavior: "smooth"
    });
  });
</script>

</body>
</html>
